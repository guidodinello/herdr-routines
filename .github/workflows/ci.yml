# Baseline CI for a small/single-package Python repo — mirrors the pre-commit
# baseline (templates/pre-commit/python.yaml) as a required gate, since
# pre-commit itself only runs locally and CI is the only place a required
# check can actually enforce it. Three jobs: lint, typecheck (mypy, strict on
# src/ via pyproject.toml) and tests, gated by the single "CI" aggregator job
# below. No path filtering (add dorny/paths-filter once this repo is a monorepo
# with independent subprojects — not needed for a single package).
#
# Adopt: cp to .github/workflows/ci.yml, fill in the two <FIXME> spots,
# then add "CI" as the required_status_checks context for this repo in
# github-standard.json.
#
# Before the first push, check the target repo actually has what this
# workflow assumes — two gaps found rolling this out the first time:
#   - `ruff`/`pytest` must be in the project's own dev dependency group.
#     A repo that only runs ruff through pre-commit's isolated hook env
#     doesn't have it on `uv sync --dev`'s PATH; CI fails with
#     "Failed to spawn: `ruff`" even though pre-commit works fine locally.
#   - ruff >=0.13 formats fenced Python code blocks inside Markdown by
#     default. `ruff format --check .` at a repo root with a docs/ folder
#     will try to reformat illustrative code snippets in prose. Add
#     `extend-exclude = ["docs"]` (or wherever non-source markdown lives)
#     under `[tool.ruff]` in pyproject.toml — fixes it for local
#     pre-commit and editors too, not just this workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default GITHUB_TOKEN scope for every job below — neither lints nor tests
# writes anything (no comments, no pushes, no packages). Least privilege.
permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    # Runner pool is switchable per repo without editing this file: set the
    # CI_RUNNERS repo variable to a JSON array of runner labels — e.g.
    # ["self-hosted","linux","x64"] — to route CI off GitHub-hosted runners
    # when their minutes are unavailable (on a private repo, exhausting the
    # free tier makes every job refuse to start). Unset means ubuntu-latest.
    # See dev-standards' README § CI runners for the commands.
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Must match language_version in .pre-commit-config.yaml, or uv
          # builds the venv on the newest allowed Python and pre-commit
          # can't find python3.13.
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --dev

      # The commands live in scripts/ci-check.sh, which the pipeline also runs before
      # it pushes, so CI and the pipeline's own check cannot drift apart.
      - name: ruff format + lint
        run: scripts/ci-check.sh lint

      # Hook envs live in ~/.cache/pre-commit, outside setup-uv's cache.
      # pre-commit rebuilds an env whose interpreter has since changed.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # Runs the whole .pre-commit-config.yaml so the hygiene hooks gate merges
      # too; a hookless clone, --no-verify or the web editor skips them locally.
      - name: pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  typecheck-python:
    name: Typecheck Python
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --dev

      # Paths, strictness and the `logger` override live in [tool.mypy] in
      # pyproject.toml, so this matches what `uv run mypy` does locally.
      - name: mypy
        run: scripts/ci-check.sh typecheck

  test-python:
    name: Tests (Python)
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: pytest
        run: scripts/ci-check.sh test

  # Single stable check name for the branch ruleset (see dev-standards
  # templates/ci/python-ci.yml). if: always() so it still runs (and fails) when a
  # needed job fails; a skipped required check would count as passing.
  ci:
    name: CI
    needs:
      - lint-python
      - typecheck-python
      - test-python
    if: always()
    runs-on: ${{ fromJSON(vars.CI_RUNNERS || '["ubuntu-latest"]') }}
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "A required job finished as: $r"
              exit 1
            fi
          done
