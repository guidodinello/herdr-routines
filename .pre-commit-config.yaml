# Baseline pre-commit config for a Python repo. Scoped down from a larger
# project's config (module-boundary checks, security scanners, framework-
# specific hooks) to the hygiene + formatting layer every Python repo wants
# regardless of size — see docs/github-standard.md § CI/pre-commit baseline
# for what's deliberately left out and why.
#
# Adopt: cp this file to .pre-commit-config.yaml at the repo root, adjust
# `language_version`/pyupgrade's `--pyXY-plus` to match your actual Python
# version, then `pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
      - id: debug-statements
        language_version: python3.13

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args: [--py313-plus]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-format
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
