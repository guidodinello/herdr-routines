# Shared defaults merged under each job's own fields.
# Same key set as the legacy top-level ``defaults:`` block in jobs.yaml.
# Absent keys fall through to _JOB_DEFAULTS (config.py).

agent_kind: claude
workspace: worktree
timeout_ms: 1800000 # 30 min
catch_up_minutes: 120
timezone: America/Montevideo
# failure_markers: ["Free usage exceeded"] # optional (docs/failure-reaping.md §3.4):
#                                          # screen markers scanned after a failed prompt
#                                          # wait; omit for the built-in defaults.
# fallback_model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free" # optional: retried
#                                          # once, under a fresh run_id, when the primary
#                                          # model's run fails with reason quota_exhausted —
#                                          # point it at a second free-tier provider so one
#                                          # exhausted pool doesn't stall every job using it.
#                                          # Only valid for agent_kind in AGENT_MODEL_FLAGS
#                                          # (claude, opencode).
# notify_policy: terminal # optional (issue 009): always | terminal | on-finding |
#                                          # on-failure. "terminal" (default) reproduces
#                                          # pre-issue-009 behavior: one notification per
#                                          # run's terminal outcome (done or failed),
#                                          # never a mid-dispatch progress ping.
#                                          # "on-finding" additionally suppresses a clean
#                                          # success, but still surfaces a gate that found
#                                          # (and fixed) something, or a fallback_model
#                                          # retry. "on-failure" is the strictest — silent
#                                          # unless the run actually failed; good for a
#                                          # frequently-run job (e.g. babysit-prs's */10
#                                          # cron) where even a clean-success ping is too
#                                          # much. "always" restores every per-tick ping,
#                                          # including progress notes mid-dispatch.
#                                          # Independent of on_missed, which keeps its own
#                                          # meaning.
