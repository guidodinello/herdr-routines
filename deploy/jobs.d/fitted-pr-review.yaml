# Example (issue 071): a routine PR reviewer whose "done" is proven, not claimed.
#
# A routine run is `done` once its agent settles with a non-empty $ROUTINE_REPORT, which
# is the agent's word. `verify:` lists post-run gates the runner checks before recording
# the run; any failed gate makes it `failed` with reason `verify_failed:<gate>`.
#   review_posted      the PR named on the report's `Target:` line carries a review from a
#                      trusted author, posted since this run started
#   report_wellformed  the report is real Markdown (not empty, not one line of `\n` escapes)
#
# Ships DISABLED; point `repo` at your checkout and enable it. Only a `routine` job honors
# `verify`; it is also inheritable from defaults.yaml (an explicit `verify: []` opts out).
enabled: false
cron: "0 9 * * 1-5"
repo: /home/you/projects/your-repo
workspace: worktree
base: main
agent_kind: opencode
model: null
prompt: |
  Pick the oldest open PR in this repo that has no review yet and run /code-review on it.
  Post the review on the PR.
  Then write your summary to $ROUTINE_REPORT as Markdown, with the PR on a line of its own
  in exactly this form (the run is failed without it):
  Target: <owner>/<repo>#<number>
verify:
  - review_posted
  - report_wellformed
timeout_ms: 900000
start_timeout_ms: 120000
on_missed: log
notify_policy: on-failure
