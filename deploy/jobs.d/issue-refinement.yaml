# Issue refinement job — ROADMAP Parking Lot idea → refined-issue PR (issue 029).
#
# Product refinement (what/why/should-we from a raw idea), distinct from the
# overnight pipeline's implementation refinement (how to build a formed issue).
# Nightly 22:00 — clear of the morning cluster (05:00-08:00) and the pipeline's
# 02:00 launch. opencode only, no Claude.
#
# Stage 0 (selection + "already refined" guard) is `uv run herdr-routines refine-issue`
# (src/herdr_routines/issue_refinement.py) — not a standalone binary on the hosts,
# same as every systemd unit (issue 050). The author→reviewer loop runs inside
# this one job session: the job agent authors, then invokes a fresh independent
# `opencode run` (different model) as the reviewer — no nested `herdr agent`
# spawn, so this needs none of the pipeline's HERDR_ENV workspace plumbing.
# The loop's two rules are code, not prose (issues 034/035 precedent): after each
# review pass `refine-issue --review-pass N --reviewer-reply FILE` parses the
# reviewer's confidence and enforces the 3-pass cap; before the PR
# `refine-issue --check-issue PATH` validates the new issue's frontmatter. Both
# answer by exit code like `gate`. `validate` warns if this job ever stops being
# opencode-only.
#
# Output is a PR on head `auto/issue-refinement-<run_id>` (built from `name` by
# runner.build_branch_name — NOT `auto/pipeline-*`, so issue 028's open-PR guard
# leaves it alone) for a human to merge. The refined issue only reaches
# `pick-feature` after that merge lands on `main`.

enabled: true
cron: "0 22 * * *"
repo: /home/guido/.local/state/herdr-routines/repos/herdr-routines # a plain clone;
    # runner syncs it to origin/main and branches a fresh worktree off it each run.
workspace: worktree
base: main
agent_kind: opencode
model: opencode/big-pickle # the author. The reviewer runs as a separate
    # `opencode run -m nvidia/moonshotai/kimi-k3` (see prompt) — a different
    # provider AND model family, so the review is independent of the author.
fallback_model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free" # quota_exhausted on Zen → retry on
    # OpenRouter; deliberately not the reviewer's model, so a fallback run stays independent.
timeout_ms: 3600000 # 1h — a 3-pass author→reviewer loop plus PR creation.
start_timeout_ms: 120000
on_missed: log
notify_policy: terminal
prompt: |
  You are the issue-refinement worker (issue 029). Promote exactly ONE ROADMAP
  Parking Lot idea into a buildable issue file, delivered as a PR for a human to
  merge. opencode only. Your cwd is a fresh git worktree on branch
  auto/issue-refinement-<run_id>; base is main. $ROUTINE_REPORT is your report path.

  1. SELECT. From your cwd, run (it is not a standalone binary — always via `uv run`):
       uv run herdr-routines refine-issue
     stdout is the Parking Lot bullet to refine, a blank line, then a
     `Refines-Parking-Lot: <slug>` line — keep both. A non-zero exit means
     nothing is eligible OR the "already refined" guard could not run (e.g. gh
     failure): write that reason to $ROUTINE_REPORT and STOP. Never invent an idea.

  2. AUTHOR. Create docs/process/issues/NNN-<slug>.md where NNN is the highest
     existing issue number + 1 (zero-padded to 3 digits). Frontmatter: id "NNN",
     title, status: open, priority (high|medium|low), area — then ## Description,
     ## Design, ## Acceptance sections detailed enough for one worker to build.
     Copy the shape of a recent issue file in that directory. Also add a one-line
     ROADMAP.md Parking Lot pointer for the idea ending
     ``→ [`NNN`](docs/process/issues/NNN-<slug>.md)``.

  3. REVIEW LOOP — the code decides when it ends (at most 3 passes). Independence
     is the point: each pass runs a FRESH reviewer in its own session and a
     different model — never re-read your own draft as the review. For pass N
     (N = 1, 2, 3), save the reviewer's raw reply OUTSIDE the worktree (step 5
     runs `git add -A`) to $ROUTINE_REPORT.review-N.txt:
       opencode run --dir . -m nvidia/moonshotai/kimi-k3 \
         "You are reviewing a draft issue file for herdr-routines. Read
          docs/process/issues/NNN-<slug>.md and compare it to the other files in
          docs/process/issues/. Judge whether it is buildable by a single worker
          and follows the conventions. DO NOT edit any files. Reply with one line
          'confidence: high' | 'confidence: medium' | 'confidence: low' followed
          by the concrete gaps you would want fixed." \
         > $ROUTINE_REPORT.review-N.txt
     Then ALWAYS ask the loop check — do not judge consensus yourself:
       uv run herdr-routines refine-issue --review-pass N --reviewer-reply $ROUTINE_REPORT.review-N.txt
     - exit 0 → apply the reviewer's notes from that file to the draft and run
       pass N+1.
     - exit 1 → leave the loop. stderr says `consensus reached` or `capped at 3`;
       record which. If capped, carry the reviewer's remaining notes into the PR
       body under a "## Open review notes" heading.
     - exit 2 → you called it wrong (missing/unreadable reply file); fix the
       call, never skip it.

  4. CHECK THE ISSUE FILE. After the loop's last edit and before any git command:
       uv run herdr-routines refine-issue --check-issue docs/process/issues/NNN-<slug>.md
     A non-zero exit lists the frontmatter problems on stderr: fix them and
     re-run until it exits 0. If you cannot make it pass, write the problems to
     $ROUTINE_REPORT and STOP — do not open the PR.

  5. OPEN THE PR (never commit to main) — only after step 4 exited 0:
       git add -A
       git commit -m "docs: refine issue NNN — <title> (issue 029)"
       git push -u origin HEAD
       gh pr create --base main --title "docs: refine issue NNN — <title>" --body "$(cat <<'EOF'
       Promotes a ROADMAP Parking Lot idea to a buildable issue (issue 029).

       Refines-Parking-Lot: <slug>

       Review loop: <N> pass(es); reviewer consensus: <reached | capped at 3> (per the loop check).
       EOF
       )"

  6. REPORT. Write to $ROUTINE_REPORT: the bullet picked, the new issue number,
     the PR URL, the loop pass count, and whether consensus was reached.
