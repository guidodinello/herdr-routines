# Example herdr-routines job list. Copy to the path resolved by
# `herdr_routines.config.default_config_path()` (--config, then
# $HERDR_PLUGIN_CONFIG_DIR/jobs.yaml, then ~/.config/herdr-routines/jobs.yaml) and edit for
# your own jobs. See docs/plan-v1.md §2 for the full schema.
#
# jobs.yaml itself is host-specific (repo: paths are local to whichever machine's Herdr server
# runs the jobs — see docs/plan-v1.md §3) and is deliberately NOT committed; only this example
# is.

version: 1

defaults:
  agent_kind: claude
  workspace: worktree
  timeout_ms: 1800000 # 30 min
  catch_up_minutes: 120
  timezone: America/Montevideo
  # failure_markers: ["Free usage exceeded"] # optional (docs/failure-reaping.md §3.4):
  #                                          # screen markers scanned after a failed prompt
  #                                          # wait; omit for the built-in defaults.
  tmp_hygiene: # optional (issue 027): age-based /tmp cleanup for leaked agent .so files
    enabled: true
    max_age_s: 3600 # reap files older than 1h (default)
    tmp_dir: /tmp

# retention: # optional (issue 021): state-dir history rotation + prune window. Uncomment to
#   # enable; the default is rotation off, so a copy of this file changes nothing until you do.
#   history_max_bytes: 10485760   # roll history.jsonl aside past 10 MiB (null = never)
#   history_max_age_days: 30      # ...or once its oldest record is 30 days old (null = never)
#   reports_max_age_days: 90      # window for `herdr-routines prune reports` (null = 90)
#
# Rotation is a rename, never a delete, and happens at the end of every tick. Deleting is
# always explicit: `herdr-routines prune reports --dry-run` to see, `--yes` to do it. In a
# jobs.d/ layout this lives in its own retention.yaml instead (never treated as a job).

# trusted_review_authors: # optional: the GitHub logins whose PRs and review feedback
#   # unattended agents act on (the pr_health auto-fix and pipeline stage 7). The
#   # authenticated `gh` user is always trusted on top of this list, so it is not listed.
#   # Absent = [copilot-pull-request-reviewer]; a list here replaces that default, and
#   # [] means "only the gh user". Matching is by login, case-insensitive.
#   - copilot-pull-request-reviewer
#
# In a jobs.d/ layout this lives in its own trusted_review_authors.yaml, whose whole
# document is the list (never treated as a job).

jobs:
  - name: nightly-dep-audit
    enabled: true
    cron: "0 3 * * *"
    repo: /home/guido/projects/fitted # a normal clone is fine; `herdr worktree create` makes a
                                       # new linked worktree elsewhere from it each run
    # repository: https://github.com/org/repo.git  # optional: managed clone lifecycle.
    # When repo: is absent, checkout is auto-derived to $HERDR_PLUGIN_STATE_DIR/repos/<name>
    # (or ~/.local/state/herdr-routines/repos/<name>). When both are present, repo: is the
    # explicit checkout path and repository: is its remote.
    workspace: worktree
    base: main
    agent_kind: opencode
    model: null # native model flag, e.g. "opencode/big-pickle"; null = agent default.
                # Only supported for agent_kind claude/opencode (see docs/plan-v1.md §2).
    prompt: |
      Review the dependency tree for known CVEs and unpinned versions.
      Write your findings to $ROUTINE_REPORT as Markdown. Do not commit or push.
    timeout_ms: 2700000
    start_timeout_ms: 120000
    catch_up_minutes: 120
    on_missed: log
  # auto-fix job: the pipeline only opens a PR branch to fix pre-existing CI/lint failures
  # or unresolved review threads on an *existing* PR — it never creates new PRs on its own.
  # A job is conditional when it has `checks:` — ordered, all must pass; any failure dispatches
  # the fix agent (the job's own agent fields). No `checks` = a watchdog/report-and-commit
  # delegate. `target` is optional and inferred from the check kinds (pr_health ⇒ pr, commands
  # ⇒ base).

  - name: babysit-prs
    enabled: true
    cron: "*/10 * * * *"
    repo: /home/guido/projects/herdr-routines
    workspace: worktree
    base: main
    kind: gated
    max_workers_per_tick: 3 # one fix worker per flagged PR, ≤3/tick
    max_attempts_per_target: 3 # retry budget, keyed per PR
    checks:
      - pr_health: null # builtin: CI red OR review threads unresolved; polls gh, never spawns
    agent_kind: opencode
    model: null
    prompt: "" # empty = pipeline-injected fix prompt template (seeded with the flagged PR's output)
    timeout_ms: 1800000
    start_timeout_ms: 120000
    on_missed: log

  # event-triggered job (issue 014): `github_event` is a poll predicate, same shape as
  # pr_health — `cron` is the poll cadence, not the event. Each tick reads `gh` and diffs
  # the returned event IDs against `last_seen_event_ids`; a new matching event dispatches
  # one worker (capped by max_workers_per_tick), a clean poll costs only the read-only
  # `gh api` call. No listener, no tunnel, no inbound reachability. v1 closed `query` set:
  # prs:labels | issues:opened | ci:failed; `match` accepts label/branch/author.
  # The first successful `issues:opened` poll adopts the issues already open as a
  # baseline and dispatches nothing; prs:labels and ci:failed fire on the first poll.
  - name: on-ready-for-agent-pr
    enabled: true
    cron: "*/10 * * * *" # poll cadence (every 10 min), not the event itself
    repo: /home/guido/projects/herdr-routines
    workspace: worktree
    base: main
    kind: gated
    max_workers_per_tick: 1 # one fix worker per new event, ≤1/tick
    max_attempts_per_target: 3 # retry budget, keyed per event_id
    checks:
      - github_event: # builtin: poll matching events, never spawns on a clean tick
          query: prs:labels
          repo: owner/repo # optional; defaults to the job repo's origin remote
          match: { label: "ready-for-agent" }
          timeout_ms: 60000
    agent_kind: opencode
    model: null
    prompt: "" # empty = engine prompt seeded with the event payload
    timeout_ms: 1800000
    start_timeout_ms: 120000
    on_missed: log

  # Proposed (docs/pipeline/features/gate-trigger-standing-job.md): a repository-hygiene
  # routine. Same job shape as babysit-prs but checks are commands — the agent runs ONLY when
  # a check exits non-zero (e.g. ruff+mypy). All commands passing -> done, no agent, no PR.
  # target is inferred as base (command checks), so the fix lands on base, opens
  # auto/<job>-<ts> PR; pr_health infers target: pr. Scheduled at 13:00 (not 03:00): the
  # overnight pipeline fires at 02:00 on this same repo and builds its own PRs — 13:00 catches
  # the pipeline's leftover ruff/mypy debt before the next night's build.
  # - name: repo-hygiene
  #   enabled: true
  #   cron: "0 13 * * *"
  #   repo: /home/guido/projects/herdr-routines
  #   workspace: worktree
  #   base: main
  #   kind: gated
  #   max_workers_per_tick: 1
  #   max_attempts_per_target: 3
  #   checks:                           # ordered; any failure dispatches the fix agent
  #     - command: uv run ruff check . #   cwd = worktree of target
  #       timeout_ms: 120000
  #     - command: uv run mypy
  #       timeout_ms: 120000
  #   agent_kind: opencode
  #   model: null
  #   prompt: "" # empty = injected fix prompt seeded with the failing check output
  #   timeout_ms: 1800000
  #   start_timeout_ms: 120000
  #   on_missed: log

# telegram_spawn: # optional (issue 024): cold-start a session from a cold Telegram
#   # message. The bridge's poller calls `herdr-routines spawn-from-telegram` (or the
#   # scripts/herdr-spawn-from-telegram.sh shim) with the sender's chat id and the
#   # message text; a `/run <alias>` or `/start <alias>` from the one allowlisted chat
#   # opens a worktree (or a tab, workspace: root), starts an agent against it, and
#   # replies with the pane handle the existing reply-to-steer flow then uses.
#   allowed_chat_id: 123456789 # REQUIRED when the block is present. Must be non-empty:
#                              # an unset value is a config error, never "allow all".
#   aliases:
#     - alias: nightly # the token typed after /run or /start (same [a-z][a-z0-9_-] shape)
#       repo: /home/guido/projects/fitted # must exist and be a git checkout, or validate fails
#       agent_kind: opencode # optional, default claude
#       workspace: worktree # optional, default worktree (`root` = in the checkout itself)
#       model: opencode/big-pickle # optional default model; `/run <alias> [harness] [model]` overrides
#       base: main # optional, default main: the branch a worktree spawn starts from
