# Example herdr-routines job list. Copy to the path resolved by
# `herdr_routines.config.default_config_path()` (--config, then
# $HERDR_PLUGIN_CONFIG_DIR/jobs.yaml, then ~/.config/herdr-routines/jobs.yaml) and edit for
# your own jobs. See docs/plan-v1.md §2 for the full schema.
#
# jobs.yaml itself is host-specific (repo: paths are local to whichever machine's Herdr server
# runs the jobs — see docs/plan-v1.md §3) and is deliberately NOT committed; only this example
# is.

version: 1

defaults:
  agent_kind: claude
  workspace: worktree
  timeout_ms: 1800000 # 30 min
  catch_up_minutes: 120
  timezone: America/Montevideo
  # failure_markers: ["Free usage exceeded"] # optional (docs/failure-reaping.md §3.4):
  #                                          # screen markers scanned after a failed prompt
  #                                          # wait; omit for the built-in defaults.

jobs:
  - name: nightly-dep-audit
    enabled: true
    cron: "0 3 * * *"
    repo: /home/guido/projects/fitted # a normal clone is fine; `herdr worktree create` makes a
                                       # new linked worktree elsewhere from it each run
    # repository: https://github.com/org/repo.git  # optional: managed clone lifecycle.
    # When repo: is absent, checkout is auto-derived to $HERDR_PLUGIN_STATE_DIR/repos/<name>
    # (or ~/.local/state/herdr-routines/repos/<name>). When both are present, repo: is the
    # explicit checkout path and repository: is its remote.
    workspace: worktree
    base: main
    agent_kind: opencode
    model: null # native model flag, e.g. "opencode/big-pickle"; null = agent default.
                # Only supported for agent_kind claude/opencode (see docs/plan-v1.md §2).
    prompt: |
      Review the dependency tree for known CVEs and unpinned versions.
      Write your findings to $ROUTINE_REPORT as Markdown. Do not commit or push.
    timeout_ms: 2700000
    start_timeout_ms: 120000
    catch_up_minutes: 120
    on_missed: log
  # auto-fix job: the pipeline only opens a PR branch to fix pre-existing CI/lint failures
  # or unresolved review threads on an *existing* PR — it never creates new PRs on its own.
  # A job is conditional when it has `checks:` — ordered, all must pass; any failure dispatches
  # the fix agent (the job's own agent fields). No `checks` = a watchdog/report-and-commit
  # delegate. `target` is optional and inferred from the check kinds (pr_health ⇒ pr, commands
  # ⇒ base).

  - name: babysit-prs
    enabled: true
    cron: "*/10 * * * *"
    repo: /home/guido/projects/herdr-routines
    workspace: worktree
    base: main
    max_workers_per_tick: 3 # one fix worker per flagged PR, ≤3/tick
    max_attempts_per_target: 3 # retry budget, keyed per PR
    checks:
      - pr_health # builtin: CI red OR review threads unresolved; polls gh, never spawns
    agent_kind: opencode
    model: null
    prompt: "" # empty = pipeline-injected fix prompt template (seeded with the flagged PR's output)
    timeout_ms: 1800000
    start_timeout_ms: 120000
    on_missed: log

  # Proposed (docs/pipeline/features/gate-trigger-standing-job.md): a repository-hygiene
  # routine. Same job shape as babysit-prs but checks are commands — the agent runs ONLY when
  # a check exits non-zero (e.g. ruff+mypy). All commands passing -> done, no agent, no PR.
  # target is inferred as base (command checks), so the fix lands on base, opens
  # auto/<job>-<ts> PR; pr_health infers target: pr. Scheduled at 13:00 (not 03:00): the
  # overnight pipeline fires at 02:00 on this same repo and builds its own PRs — 13:00 catches
  # the pipeline's leftover ruff/mypy debt before the next night's build.
  # - name: repo-hygiene
  #   enabled: true
  #   cron: "0 13 * * *"
  #   repo: /home/guido/projects/herdr-routines
  #   workspace: worktree
  #   base: main
  #   max_workers_per_tick: 1
  #   max_attempts_per_target: 3
  #   checks:                           # ordered; any failure dispatches the fix agent
  #     - command: uv run ruff check . #   cwd = worktree of target
  #       timeout_ms: 120000
  #     - command: uv run mypy
  #       timeout_ms: 120000
  #   agent_kind: opencode
  #   model: null
  #   prompt: "" # empty = injected fix prompt seeded with the failing check output
  #   timeout_ms: 1800000
  #   start_timeout_ms: 120000
  #   on_missed: log
