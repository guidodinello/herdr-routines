<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" color="#16303f" viewBox="0 0 780 610" role="img" aria-label="Sequence of one scheduled run: timer fires, lock acquired and job found due, pane created, agent started, prompt sent and awaited, result verified against report file and settle status, then recorded to history and a notification sent.">
          <defs>
            <marker id="b-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="currentColor"></path>
            </marker>
          </defs><rect x="0" y="0" width="100%" height="100%" fill="#eceff1"></rect>

          <line x1="50" y1="46" x2="50" y2="546" stroke="#b9c4c6" stroke-width="2"></line>

          <!-- node template repeated -->
          <g>
            <circle cx="50" cy="60" r="7" fill="#eceff1" stroke="currentColor" stroke-width="1.6"></circle>
            <text x="78" y="56" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-weight="600" font-size="14" fill="currentColor">Timer fires</text>
            <text x="78" y="75" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4c6472">OnCalendar=*:0/5 → herdr-routines tick</text>
          </g>

          <g>
            <circle cx="50" cy="140" r="7" fill="#eceff1" stroke="currentColor" stroke-width="1.6"></circle>
            <text x="78" y="136" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-weight="600" font-size="14" fill="currentColor">Lock &amp; decide</text>
            <text x="78" y="155" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4c6472">flock tick.lock; schedule.decide(cron, now) → RUN</text>
          </g>

          <g>
            <circle cx="50" cy="220" r="7" fill="#eceff1" stroke="currentColor" stroke-width="1.6"></circle>
            <text x="78" y="216" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-weight="600" font-size="14" fill="currentColor">Create pane</text>
            <text x="78" y="235" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4c6472">worktree_create / tab_create → pane_id</text>
          </g>

          <g>
            <circle cx="50" cy="300" r="7" fill="#eceff1" stroke="currentColor" stroke-width="1.6"></circle>
            <text x="78" y="296" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-weight="600" font-size="14" fill="currentColor">Start agent</text>
            <text x="78" y="315" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4c6472">agent_start(name, kind, pane_id, start_timeout_ms)</text>
          </g>

          <g>
            <circle cx="50" cy="380" r="7" fill="#eceff1" stroke="currentColor" stroke-width="1.6"></circle>
            <text x="78" y="376" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-weight="600" font-size="14" fill="currentColor">Prompt &amp; wait</text>
            <text x="78" y="395" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4c6472">agent_prompt_wait($ROUTINE_REPORT filled in)</text>
          </g>

          <g>
            <circle cx="50" cy="460" r="7" fill="#eceff1" stroke="currentColor" stroke-width="1.6"></circle>
            <text x="78" y="456" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-weight="600" font-size="14" fill="currentColor">Verify</text>
            <text x="78" y="475" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4c6472">report file written &amp; non-empty? status settled clean?</text>
            <rect x="480" y="443" width="52" height="22" fill="#3f7d6f" opacity="0.9"></rect>
            <text x="506" y="458" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10.5" fill="#ffffff">done</text>
            <rect x="542" y="443" width="150" height="22" fill="none" stroke="#b97a1e" stroke-width="1.4"></rect>
            <text x="617" y="458" text-anchor="middle" font-family="IBM Plex Mono, Consolas, monospace" font-size="10" fill="#b97a1e">failed: no_report / blocked</text>
          </g>

          <g>
            <circle cx="50" cy="540" r="7" fill="#eceff1" stroke="currentColor" stroke-width="1.6"></circle>
            <text x="78" y="536" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-weight="600" font-size="14" fill="currentColor">Record &amp; notify</text>
            <text x="78" y="555" font-family="IBM Plex Mono, Consolas, monospace" font-size="11" fill="#4c6472">history.append(terminal record); notification_show(...)</text>
          </g>
        </svg>
