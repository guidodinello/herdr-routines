[project]
name = "herdr-routines"
version = "0.1.0"
description = "A cron-style scheduler that drives Herdr to run coding agents unattended"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
    "croniter==6.2.4",
    "logger @ git+https://github.com/guidodinello/logger.git@main",
]

[project.scripts]
herdr-routines = "herdr_routines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_routines"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
extend-exclude = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
