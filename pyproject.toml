[project]
name = "herdr-routines"
version = "0.1.0"
description = "A cron-style scheduler that drives Herdr to run coding agents unattended"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
    "croniter==6.2.4",
    # Pinned to a commit. To bump: change the SHA, run `uv lock`, commit both files.
    "logger @ git+https://github.com/guidodinello/logger.git@7dbd2f616040a32fc5bbf458d661e7cd2d2385aa",
]

[project.scripts]
herdr-routines = "herdr_routines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_routines"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "types-croniter>=6.0.0",
    "types-PyYAML>=6.0.0",
    "vulture>=2.16",
]

[tool.ruff]
extend-exclude = ["docs"]

# A vulture whitelist is bare attribute accesses by design: each one marks a name as used.
[tool.ruff.lint.per-file-ignores]
"vulture_whitelist.py" = ["B018"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
# Applies to tests too, so dead ignores cannot accumulate outside the strict src override.
warn_unused_ignores = true

# `logger` is a direct git dependency (see [project].dependencies) that ships no py.typed
# marker, so mypy can't see into it. Nothing to install — types-* stubs don't exist for a
# private package — so silence the import rather than leave 4 permanent errors in the gate.
[[tool.mypy.overrides]]
module = ["logger", "logger.*"]
ignore_missing_imports = true

# `strict = true` is global-only in mypy, and tests carry ~200 strict errors, so src
# gets the per-module flags `--strict` implies instead. `warn_redundant_casts` is
# global-only and left out; `no_implicit_reexport` is left out because it applies to the
# exporting module, so tests importing names re-exported from src modules would fail.
[[tool.mypy.overrides]]
module = ["herdr_routines", "herdr_routines.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
strict_equality = true
extra_checks = true
# Beyond --strict: catch isinstance/None checks the declared types already make dead.
warn_unreachable = true
enable_error_code = ["redundant-expr"]

[tool.vulture]
# src/ only, never tests/: a helper that only tests call must show up as unused, which is the
# "implemented but never wired in" bug this check exists for (audit, 2026-10-23).
paths = ["src", "vulture_whitelist.py"]
# Not 80: vulture rates every unused function, method, attribute and variable at exactly
# 60% (only unused imports, arguments and unreachable code rate 90-100%), so 80 reports
# nothing here.
min_confidence = 60

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest keeps the last 3 runs' tmp_path trees by default; here one run is ~270 MiB, which
# filled the Pi's RAM-backed /tmp alongside opencode's leaked libraries (2026-10-20).
tmp_path_retention_policy = "failed"
