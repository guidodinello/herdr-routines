[project]
name = "herdr-routines"
version = "0.1.0"
description = "A cron-style scheduler that drives Herdr to run coding agents unattended"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
    "croniter==6.2.4",
    "logger @ git+https://github.com/guidodinello/logger.git@main",
]

[project.scripts]
herdr-routines = "herdr_routines.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_routines"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "types-croniter>=6.0.0",
    "types-PyYAML>=6.0.0",
]

[tool.ruff]
extend-exclude = ["docs"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"

# `logger` is a direct git dependency (see [project].dependencies) that ships no py.typed
# marker, so mypy can't see into it. Nothing to install — types-* stubs don't exist for a
# private package — so silence the import rather than leave 4 permanent errors in the gate.
[[tool.mypy.overrides]]
module = ["logger", "logger.*"]
ignore_missing_imports = true

# `strict = true` is global-only in mypy, and tests carry ~200 strict errors, so src
# gets the per-module flags `--strict` implies instead. `warn_redundant_casts` is
# global-only and left out; `no_implicit_reexport` is left out because it applies to the
# exporting module, so tests importing names re-exported from src modules would fail.
[[tool.mypy.overrides]]
module = ["herdr_routines", "herdr_routines.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
extra_checks = true

[tool.pytest.ini_options]
testpaths = ["tests"]
